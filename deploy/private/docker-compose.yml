# APOLLO Private v7 — docker-compose 定義
#
# 前提:
#   - LM Studio / Ollama 等の OpenAI 互換エンドポイントがホスト側で稼働
#     していること (デフォルトは host.docker.internal:1234)
#   - 同ディレクトリに .env を配置していること (.env.example を参照)
#
# 起動:
#   cd deploy/private
#   cp .env.example .env    # 初回のみ、値を編集
#   docker compose up -d
#
# アクセス: http://localhost:8501

services:
  apollo:
    image: jl1nie/apollo-private:latest
    container_name: apollo-private-v7
    restart: unless-stopped

    ports:
      - "8501:8501"

    volumes:
      # Docker named volume に永続化 (埋め込みキャッシュ・アップロード)。
      # ホスト側のパスを意識せずに済むので Docker Desktop で扱いやすい。
      # 中身を直接いじりたい時は `docker compose cp apollo:/var/lib/apollo ./out`
      # で取り出すか、bind mount に書き換える。
      - apollo-data:/var/lib/apollo

    env_file:
      - .env

    # Linux 上の Docker でも `host.docker.internal` でホストを参照可能にする
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  apollo-data:
    name: apollo-private-data
